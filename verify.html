<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الوثيقة الهندسية</title>
    <style>
        body { font-family: tahoma, arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .card { max-width: 500px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .success { color: #2e7d32; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .error { color: #c62828; font-size: 20px; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; text-align: right; }
        .label { font-weight: bold; color: #555; }
        .btn { display: inline-block; background-color: #0d47a1; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <div id="loading">جاري التحقق من المستند...</div>
    <div id="result" style="display:none;"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('id');

    if (!docId) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = '<p class="error">❌ خطأ: لم يتم تحديد رقم الوثيقة.</p>';
    } else {
        fetch('documents.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';

                if (data[docId]) {
                    const doc = data[docId];
                    document.getElementById('result').innerHTML = `
                        <div class="success">✅ وثيقة هندسية أصلية ومعتمدة</div>
                        <div class="info-row"><span class="label">الرقم المرجعي:</span> <span>${docId}</span></div>
                        <div class="info-row"><span class="label">نوع الوثيقة:</span> <span>${doc.type}</span></div>
                        <div class="info-row"><span class="label">الجهة / العميل:</span> <span>${doc.issued_to}</span></div>
                        <div class="info-row"><span class="label">تاريخ الاعتماد:</span> <span>${doc.date}</span></div>
                        <div class="info-row"><span class="label">حالة الملف:</span> <span style="color:green;">${doc.status}</span></div>
                        <a href="${doc.pdf_url}" target="_blank" class="btn">📥 استعراض وتحميل ملف الـ PDF الأصلي</a>
                    `;
                } else {
                    document.getElementById('result').innerHTML = '<p class="error">⚠️ تحذير: هذه الوثيقة غير مسجلة أو تم التلاعب بها.</p>';
                }
            })
            .catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML = '<p class="error">حدث خطأ أثناء جلب البيانات.</p>';
            });
    }
</script>

</body>
</html>
